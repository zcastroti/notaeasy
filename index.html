<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotaEasy</title>    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="conteudo">
        <section>
            <input type="text" class="inputUsuario" placeholder="Usuário">
            <input type="text" class="inputSenha" placeholder="Senha">
            <button class="btnLogin">Login <i class="fa-solid fa-fingerprint"></i></button>
        </section>
    </main>

    <style>
        main { justify-content: center; align-items: center; }
        section { display: flex; flex-flow: column; gap: 10px; }
    </style>

    <script type="module" src="login.js"></script>
    <script src="https://kit.fontawesome.com/ac3bdc8044.js" crossorigin="anonymous"></script>
</body>
</html>
