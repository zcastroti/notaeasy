<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotaEasy</title>    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="conteudo">
        <!-- Botão  ❝Novo Cliente❞ e  ❝Importar Excel❞ -->
        <div style=" display: flex; gap: 10px; ">
            <button class="btnNovoCliente">Novo Cliente <i class="fa-solid fa-user-plus"></i></button>
            <button class="btnImportar">Importar Excel <i class="fa-regular fa-file-excel"></i></button>
        </div>

        <div class="tabela-container">
            <table class="tabelaClientes">
                <thead>
                    <tr>
                        <th class="col-nome">Nome</th>
                        <th class="col-documento">Documento</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!--Dados injetados via JavaScript -->
                </tbody>
            </table>

            <!-- Botões de Paginação -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <button class="btnVoltar">Voltar</button>
                <span class="nomePagina">Página 1 de 1</span>
                <button class="btnAvancar">Avançar</button>
            </div>
        </div>
    </main>

    <style>
        tbody td { 
            padding: 8px;
            background: white;
            border: none; }

        .col-nome { 
            max-width: 210px; 
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media screen and (max-width: 450px) {
            .col-documento { display: none; }
        }

    </style>

    <script type="module" src="clientes.js"></script>
    <script src="https://kit.fontawesome.com/ac3bdc8044.js" crossorigin="anonymous"></script>
</body>
</html>
